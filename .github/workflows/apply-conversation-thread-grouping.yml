name: Apply conversation thread grouping

on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-conversation-thread-grouping.py
      - .github/workflows/apply-conversation-thread-grouping.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frankiflow-mail-conversation-grouping
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true
      - name: Apply grouping patch
        run: python scripts/apply-conversation-thread-grouping.py
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          grep -q 'thread:${m.thread_id}' assets/app.js
          grep -q "state.settings?.conversation_view!==false" assets/app.js
      - name: Commit develop changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Group inbox rows by conversation thread"
          git push origin HEAD:develop
