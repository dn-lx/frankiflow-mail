name: Repair Android PWA Web Push

on:
  push:
    branches:
      - develop
    paths:
      - scripts/repair-web-push-registration.py
      - .github/workflows/repair-web-push-registration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Apply Web Push repair
        run: python scripts/repair-web-push-registration.py

      - name: Validate JavaScript and service worker
        run: |
          node --check assets/app.js
          node --check sw.js
          grep -q "Repair registration" assets/app.js
          grep -q "syncPushSubscription" assets/app.js
          grep -q "frankiflow-mail-dev-v10" sw.js

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/app.js sw.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js sw.js
          git commit -m "Repair Android PWA push registration"
          git push origin develop
