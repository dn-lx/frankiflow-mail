name: Clarify sender identity status

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frankiflow-mail-sender-identity-status
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Clarify sender identity status panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/app.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            'Sender profile & email identity':'Sender identity status',
            'FrankiFlow sender identity</strong><small>Recipients may show your verified brand avatar in Gmail/Outlook only when their provider supports it and the domain/provider branding is configured.':'FrankiFlow sender identity</strong><small>FrankiFlow Mail controls the sender address and display name. The Gmail/Outlook inbox avatar is controlled externally by the receiving provider and cannot be uploaded from this app.',
            '<div class="identity-tags"><span>frankiflow.de</span><span>BIMI / provider setup</span></div>':'<div class="identity-tags"><span>frankiflow.de</span><span>SPF verified</span><span>DKIM verified</span><span>BIMI certificate required for Gmail logo</span></div>',
            'Email profile image setup':'Gmail logo requirements',
            "Changing this preview does not force an external Gmail or Outlook avatar. The final recipient image is controlled by domain authentication and the recipient's mail provider.":'This is a sender-identity status panel, not an avatar uploader. A Gmail brand logo requires BIMI plus the required DMARC policy and a VMC or CMC certificate.',
            "openModal('Email profile image',`<div class=\"identity-guide\"": "openModal('Gmail logo requirements',`<div class=\"identity-guide\""
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected sender-identity text not found: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          grep -q "Sender identity status" assets/app.js
          grep -q "Gmail logo requirements" assets/app.js
          grep -q "SPF verified" assets/app.js
          grep -q "BIMI certificate required for Gmail logo" assets/app.js

      - name: Commit clarification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Clarify external sender avatar requirements"
          git push origin HEAD:develop
