name: Security checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan high-severity findings
        run: >
          semgrep scan
          --config auto
          --severity ERROR
          --error
          --exclude .graphify
          --exclude node_modules
          --exclude dist
          --exclude coverage
          .

  obvious-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject common committed secret formats
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if grep -RInE "$pattern" .             --exclude-dir=.git             --exclude-dir=node_modules             --exclude-dir=.graphify             --exclude-dir=dist             --exclude-dir=coverage; then
            echo "Potential committed secret detected."
            exit 1
          fi
          echo "No obvious secret pattern found."

  runtime-dependencies:
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build temporary dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
