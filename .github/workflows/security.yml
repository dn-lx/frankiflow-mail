name: Security checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan high-severity findings
        run: >
          semgrep scan
          --config auto
          --severity ERROR
          --error
          --exclude .graphify
          --exclude node_modules
          --exclude dist
          --exclude coverage
          .

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
  runtime-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit production dependencies when package.json exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "No package.json; dependency audit not applicable."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
