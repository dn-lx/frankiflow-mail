name: Apply FrankiFlow Mail reader and scheduler fixes

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/apply-mail-reader-scheduler-fixes.yml
      - scripts/apply-mail-reader-scheduler-fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Apply fixes
        run: python scripts/apply-mail-reader-scheduler-fixes.py

      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/enhancements.js
          node --check assets/config.js

      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/enhancements.js sw.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Fix labels, message dialogs, scheduler and composer close"
          git push origin HEAD:develop
