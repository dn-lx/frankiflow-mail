name: Apply FrankiFlow Mail sidebar scheduler and double-click fix

on:
  push:
    branches:
      - develop
    paths:
      - scripts/apply-sidebar-meeting-dblclick-fix.py
      - .github/workflows/apply-sidebar-meeting-dblclick-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Apply patch
        run: python scripts/apply-sidebar-meeting-dblclick-fix.py
      - name: Validate JavaScript
        run: node --check assets/enhancements.js
      - name: Validate UX wiring
        run: |
          grep -q "ffSidebarMeeting" assets/enhancements.js
          grep -q "Meeting Scheduler" assets/enhancements.js
          grep -q "ffLastMailClick" assets/enhancements.js
          grep -q "openMessageWindow(id)" assets/enhancements.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/enhancements.js
          git commit -m "Add sidebar Meeting Scheduler and reliable mail double-click"
          git push origin develop
