name: Deploy FrankiFlow Mail develop to ShipStatic

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frankiflow-mail-develop-shipstatic
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/enhancements.js
          node --check assets/config.js

      - name: Build development package
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js robots.txt ship.json _site/
          cp -R assets _site/assets
          test -f _site/assets/app.js
          test -f _site/assets/modern.css
          test -f _site/assets/enhancements.js
          test -f _site/assets/config.js
          grep -q "mail-frankiflow.shipstatic.com" _site/assets/config.js
          grep -q "isDevelopment ? 'develop' : 'production'" _site/assets/config.js
          grep -q "noindex,nofollow" _site/index.html
          ! grep -q "calendar-bridge.js" _site/index.html
          grep -q "ff-message-dialog-backdrop" _site/assets/enhancements.js
          grep -q "ff-dialog-compose" _site/assets/enhancements.js
          grep -q "dialogReplyTargets" _site/assets/enhancements.js
          grep -q "ffSidebarMeeting" _site/assets/enhancements.js
          grep -q "Meeting Scheduler" _site/assets/enhancements.js
          grep -q "ffLastMailClick" _site/assets/enhancements.js
          grep -q "openMessageWindow(id)" _site/assets/enhancements.js
          ! grep -q "ffReaderMeeting" _site/assets/enhancements.js
          grep -q "replyRecipients" _site/assets/app.js
          grep -q "composerBodyHasMeaningfulContent" _site/assets/app.js
          grep -q "frankiflow-mail-dev-v13" _site/sw.js

      - name: Headless Mail UI interaction test
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          rm -rf /tmp/ff-mail-ui-test
          mkdir -p /tmp/ff-mail-ui-test
          node <<'NODE'
          const fs=require('fs');
          let src=fs.readFileSync('assets/enhancements.js','utf8');
          const start=src.indexOf("import { createClient }");
          const end=src.indexOf("const ATTACHMENT_BUCKET");
          if(start<0||end<0) throw new Error('Could not prepare enhancement UI test');
          const stub=`const qs=(s,r=document)=>r.querySelector(s);
          const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
          const CONFIG={mode:'develop',mailbox:'info@frankiflow.de',sendFunctionUrl:'https://send.test/functions/v1/send-mail',supabasePublishableKey:'test'};
          const testMessage={id:'test-message',account_id:'acc-info',thread_id:'thread-1',direction:'inbound',folder:'inbox',subject:'UI double-click test',from_name:'Customer',from_address:'customer@example.com',reply_to:'customer@example.com',to_addresses:['info@frankiflow.de'],cc_addresses:['partner@example.com'],provider_message_id:'provider-1',html_body:'<div style="padding:18px"><b>Customer request</b><p>Please confirm the appointment.</p></div>',text_body:'Customer request',created_at:'2026-09-14T08:00:00Z'};
          const sentMessage={id:'sent-message',account_id:'acc-info',thread_id:'thread-1',direction:'outbound',folder:'sent',subject:'Re: UI double-click test',from_name:'FrankiFlow',from_address:'info@frankiflow.de',to_addresses:['customer@example.com'],cc_addresses:[],provider_message_id:'provider-2',html_body:'<p>Earlier answer from FrankiFlow.</p>',text_body:'Earlier answer from FrankiFlow.',created_at:'2026-09-14T08:05:00Z'};
          const accounts=[{id:'acc-info',address:'info@frankiflow.de',is_primary:true},{id:'acc-mail',address:'mail@frankiflow.de',is_primary:false}];
          function dbResult(table,filters){if(table==='frankiflow_mail_messages'){if(filters.id==='test-message')return{data:testMessage,error:null};if(filters.thread_id==='thread-1')return{data:[testMessage,sentMessage],error:null};return{data:[],error:null}}if(table==='frankiflow_mail_accounts')return{data:accounts,error:null};return{data:[],error:null}}
          function dbChain(table){const filters={};const chain={select(){return chain},eq(k,v){filters[k]=v;return chain},gte(){return chain},update(){return chain},insert(){return chain},delete(){return chain},order(){return chain},limit(){return Promise.resolve(dbResult(table,filters))},single(){return Promise.resolve(dbResult(table,filters))},maybeSingle(){return Promise.resolve(dbResult(table,filters))},then(resolve,reject){return Promise.resolve(dbResult(table,filters)).then(resolve,reject)}};return chain}
          const mailDb={auth:{getSession:async()=>({data:{session:{access_token:'test',user:{id:'user-1'}}}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},from:dbChain,storage:{from:()=>({createSignedUrl:async()=>({data:{signedUrl:'about:blank'}})})}};
          `;
          src=stub+src.slice(end);
          fs.writeFileSync('/tmp/ff-mail-ui-test/enhancements.js',src);
          const labels=Array.from({length:8},(_,i)=>`<button class="nav-btn"><span>Label ${i+1}</span></button>`).join('');
          const html=`<!doctype html><html><head><meta charset="utf-8"><style>
          body{margin:0;font-family:Arial}.shell{display:grid;grid-template-columns:244px 420px 1fr;height:800px}.sidebar{background:#0c3447;color:white;padding:12px;display:flex;flex-direction:column}.labels-scroll{overflow:auto;max-height:190px}.nav-btn{display:flex;padding:8px}.mail-row{padding:18px;border:1px solid #ddd;cursor:pointer}.topbar{height:60px}.reader{display:none}
          </style></head><body><div id="app"><main class="shell"><aside class="sidebar"><button id="composeMain">Compose</button><div class="nav"><button>Inbox</button></div><div class="nav-section-title">More</div><div class="nav" id="moreNav"><button>Archive</button><button>Spam</button><button>Trash</button></div><div class="nav-section-title" id="labelsTitle">Labels</div><div class="labels-scroll">${labels}</div></aside><section><div class="topbar"><button id="refreshBtn">Refresh</button></div><div class="mail-row" data-id="test-message"><span class="subject">UI double-click test</span></div></section><section id="reader" class="reader"></section></main></div><script>
          window.__uiErrors=[];window.__sendCalls=[];const nativeFetch=window.fetch.bind(window);window.fetch=async(url,opts={})=>{if(String(url).includes('send.test')){const body=JSON.parse(opts.body||'{}');window.__sendCalls.push(body);return{ok:true,status:200,json:async()=>({ok:true})}}return nativeFetch(url,opts)};
          window.addEventListener('error',e=>window.__uiErrors.push(e.message));window.addEventListener('unhandledrejection',e=>window.__uiErrors.push(String(e.reason)));
          function waitFor(sel,timeout=5000){return new Promise(resolve=>{const started=Date.now();const t=setInterval(()=>{const el=document.querySelector(sel);if(el){clearInterval(t);resolve(el)}else if(Date.now()-started>=timeout){clearInterval(t);resolve(null)}},40)})}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
          </script><script type="module" src="./enhancements.js"></script><script>
          (async()=>{
            const results={};
            const scheduler=await waitFor('#ffSidebarMeeting');
            const labelsTitle=document.querySelector('#labelsTitle');
            const labelsEl=document.querySelector('.labels-scroll');
            const labelsStyle=getComputedStyle(labelsEl);
            results.labelsVisible=labelsStyle.maxHeight==='none'&&labelsStyle.overflowY==='visible';
            results.schedulerPosition=!!scheduler&&labelsTitle?.previousElementSibling===scheduler&&scheduler.textContent.includes('Meeting Scheduler');
            results.noReaderScheduler=!document.querySelector('#ffReaderMeeting');
            scheduler?.click();await sleep(180);results.schedulerDialog=!!document.querySelector('.ff-meeting-backdrop');document.querySelector('.ff-meeting-backdrop')?.remove();
            let row=document.querySelector('.mail-row');row.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));const replacement=row.cloneNode(true);row.replaceWith(replacement);await sleep(90);replacement.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
            const dialog=await waitFor('.ff-message-dialog-backdrop');await sleep(260);results.doubleClickDialog=!!dialog;
            results.messageHistory=document.querySelectorAll('.ff-dialog-message').length===2;
            const editor=document.querySelector('#ffDialogEditor');results.dialogComposer=!!editor&&editor.isContentEditable;
            const replyAll=document.querySelector('[data-dialog-reply-mode="replyAll"]');replyAll?.click();await sleep(30);const allText=document.querySelector('#ffDialogRecipients')?.textContent||'';results.replyAllRecipients=allText.includes('customer@example.com')&&allText.includes('partner@example.com')&&!allText.includes('info@frankiflow.de');
            const reply=document.querySelector('[data-dialog-reply-mode="reply"]');reply?.click();await sleep(30);const replyText=document.querySelector('#ffDialogRecipients')?.textContent||'';results.replyRecipients=replyText.includes('customer@example.com')&&!replyText.includes('partner@example.com');
            replyAll?.click();editor.innerHTML='<p>Confirmed from dialog.</p>';document.querySelector('#ffDialogSend')?.click();for(let i=0;i<40&&!window.__sendCalls.length;i++)await sleep(50);
            const call=window.__sendCalls[0]||{};results.sent=window.__sendCalls.length===1;results.sendTo=Array.isArray(call.to)&&call.to[0]==='customer@example.com';results.sendCc=Array.isArray(call.cc)&&call.cc.includes('partner@example.com')&&!call.cc.includes('info@frankiflow.de');results.threading=call.thread_id==='thread-1'&&call.in_reply_to==='provider-1'&&call.subject==='Re: UI double-click test';
            results.runtimeErrors=window.__uiErrors.length===0;
            const pass=Object.values(results).every(Boolean);document.body.dataset.testStatus=pass?'PASS':'FAIL';document.body.dataset.testDetails=JSON.stringify(results);document.body.dataset.testErrors=JSON.stringify(window.__uiErrors);
          })();
          </script></body></html>`;
          fs.writeFileSync('/tmp/ff-mail-ui-test/index.html',html);
          NODE
          node --check /tmp/ff-mail-ui-test/enhancements.js
          python3 -m http.server 8124 --directory /tmp/ff-mail-ui-test >/tmp/ff-mail-ui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.4
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8124/index.html > /tmp/ff-mail-ui-dom.txt
          grep -o 'data-test-status="[^"]*"' /tmp/ff-mail-ui-dom.txt | tail -1 || true
          grep -o 'data-test-details="[^"]*"' /tmp/ff-mail-ui-dom.txt | tail -1 || true
          grep -o 'data-test-errors="[^"]*"' /tmp/ff-mail-ui-dom.txt | tail -1 || true
          grep -q 'data-test-status="PASS"' /tmp/ff-mail-ui-dom.txt
          echo "UI interaction test passed: scheduler placement, visible labels, double-click dialog, complete history, compose, Reply, Reply all, send recipients/threading, and no runtime errors."

      - name: Deploy development to ShipStatic
        id: ship
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./_site
          domain: mail-frankiflow.shipstatic.com
          labels: development,frankiflow-mail,develop

      - name: Verify permanent development URL
        env:
          DEV_URL: https://mail-frankiflow.shipstatic.com
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "${DEV_URL}/?verify=${GITHUB_SHA}" -o /tmp/mail-home.html; then
              break
            fi
            sleep 3
          done
          grep -q "FrankiFlow Mail" /tmp/mail-home.html
          grep -q "assets/modern.css" /tmp/mail-home.html
          grep -q "assets/enhancements.js" /tmp/mail-home.html
          ! grep -q "assets/calendar-bridge.js" /tmp/mail-home.html
          curl -fsSL "${DEV_URL}/assets/enhancements.js?verify=${GITHUB_SHA}" -o /tmp/mail-enhancements.js
          grep -q "ffConnectionPill" /tmp/mail-enhancements.js
          grep -q "ffSidebarMeeting" /tmp/mail-enhancements.js
          grep -q "ff-attachment-card" /tmp/mail-enhancements.js
          grep -q "ff-message-dialog-backdrop" /tmp/mail-enhancements.js
          grep -q "ff-dialog-compose" /tmp/mail-enhancements.js
          grep -q "dialogReplyTargets" /tmp/mail-enhancements.js
          grep -q "sidebar .labels-scroll" /tmp/mail-enhancements.js
          grep -q "ffLastMailClick" /tmp/mail-enhancements.js
          grep -q "openMessageWindow(id)" /tmp/mail-enhancements.js
          ! grep -q "ffReaderMeeting" /tmp/mail-enhancements.js
          curl -fsSL "${DEV_URL}/assets/app.js?verify=${GITHUB_SHA}" -o /tmp/mail-app.js
          grep -q "replyRecipients" /tmp/mail-app.js
          grep -q "composerBodyHasMeaningfulContent" /tmp/mail-app.js
          curl -fsSL "${DEV_URL}/sw.js?verify=${GITHUB_SHA}" -o /tmp/mail-sw.js
          grep -q "frankiflow-mail-dev-v13" /tmp/mail-sw.js

      - name: Deployment summary
        run: |
          echo "### FrankiFlow Mail development" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`develop\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI test: PASSED (scheduler placement + labels + double-click dialog + full message history + inline compose + Reply + Reply all + send/threading)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://mail-frankiflow.shipstatic.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
