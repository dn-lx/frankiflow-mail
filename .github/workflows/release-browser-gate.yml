name: Release browser gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.head_ref == 'develop' && contains(github.event.pull_request.labels.*.name, 'production-approved')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install test dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run repository checks when defined
        run: |
          npm run check --if-present
          npm run test --if-present
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run release browser matrix
        run: npm run test:e2e:release
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
