name: Apply FrankiFlow Mail v3 fixes

on:
  push:
    branches: [develop]
    paths:
      - scripts/fix-mail-v3.py
      - .github/workflows/apply-mail-v3-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frankiflow-mail-v3-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch script
        run: python -m py_compile scripts/fix-mail-v3.py
      - name: Apply fixes
        run: python scripts/fix-mail-v3.py
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/enhancements.js
          node --check sw.js
      - name: Verify fixes
        run: |
          grep -q "saveMailAccountSettings" assets/app.js
          grep -q "account-display-name" assets/app.js
          grep -q "edgeFunctionErrorMessage" assets/app.js
          grep -q "OPENAI_API_KEY in Supabase" assets/app.js
          grep -q "onclick=()=>openSignatureManager" assets/app.js
          grep -q "frankiflow-mail-dev-v6" sw.js
          ! grep -q "remove();openSignatureManager" assets/app.js
      - name: Diff check
        run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/modern.css sw.js
          git commit -m "Fix mailbox routing AI errors and settings accounts"
          git push origin HEAD:develop
