name: Apply Android PWA Web Push

on:
  push:
    branches:
      - develop
    paths:
      - scripts/add-web-push-mobile.py
      - .github/workflows/apply-web-push-mobile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Apply Web Push patch
        run: python scripts/add-web-push-mobile.py

      - name: Validate JavaScript and service worker
        run: |
          node --check assets/app.js
          node --check sw.js
          grep -q "function enablePushNotifications" assets/app.js
          grep -q "Background app notifications" assets/app.js
          grep -q "self.addEventListener('push'" sw.js
          grep -q "notificationclick" sw.js
          grep -q "Android/PWA background Web Push" assets/modern.css

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/app.js assets/modern.css sw.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/modern.css sw.js
          git commit -m "Add Android PWA background mail notifications"
          git push origin develop
