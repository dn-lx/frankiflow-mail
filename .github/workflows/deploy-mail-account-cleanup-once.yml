name: Deploy final Mail account cleanup

on:
  push:
    branches: [develop]
    paths: [.github/workflows/deploy-mail-account-cleanup-once.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop

      - name: Validate scripts
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/enhancements.js
          node --check assets/account-security.js
          node --check assets/config.js
          node --check sw.js
          grep -q 'hideLegacyMailLabel' assets/account-security.js
          grep -q 'Password & sign-in' assets/account-security.js
          grep -q 'Mail users & personal mailboxes' assets/account-security.js
          grep -q 'frankiflow-mail-dev-v17' sw.js

      - name: Headless account UI regression test
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          rm -rf /tmp/ffmailtest && mkdir -p /tmp/ffmailtest
          node <<'NODE'
          const fs=require('fs');
          let src=fs.readFileSync('assets/account-security.js','utf8');
          src=src.replace("import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.116.0';\nimport { CONFIG } from './config.js';\n",`const CONFIG={supabaseUrl:'https://example.supabase.co',supabasePublishableKey:'test'};
          const createClient=()=>({auth:{getSession:async()=>({data:{session:{access_token:'test'}}}),getUser:async()=>({data:{user:{id:'admin-user'}}}),updateUser:async()=>{window.__pw=(window.__pw||0)+1;return{error:null}}},from:(table)=>{const filters={};const chain={select(){return chain},eq(k,v){filters[k]=v;return chain},maybeSingle(){if(table==='frankiflow_mail_users')return Promise.resolve({data:{user_id:'admin-user',email:'info@frankiflow.de',role:'admin',active:true}});if(table==='frankiflow_mail_labels')return Promise.resolve({data:{id:'legacy-mail-label'}});return Promise.resolve({data:null})}};return chain}});
          `);
          fs.writeFileSync('/tmp/ffmailtest/account-security.js',src);
          fs.writeFileSync('/tmp/ffmailtest/index.html',`<!doctype html><html><body>
          <form id="loginForm"><input id="email" value="info@frankiflow.de"><input id="password"><button>Login</button></form>
          <button data-mobile-filter="mail">Mail filter</button>
          <button data-label="legacy-mail-label">Mail</button>
          <div class="settings-hub"><section class="settings-section"><h4>Sender identity status</h4></section><section class="settings-section"><h4>Organization & tools</h4></section></div>
          <script>window.fetch=async()=>({ok:true,json:async()=>({users:[{user_id:'admin-user',email:'info@frankiflow.de',role:'admin',active:true,accounts:[{address:'info@frankiflow.de',is_default:true}]}]})});localStorage.clear();function sleep(ms){return new Promise(r=>setTimeout(r,ms))}</script>
          <script type="module" src="./account-security.js"></script><script>(async()=>{await sleep(600);const checks={login:document.querySelector('#email').value==='',identity:![...document.querySelectorAll('h4')].some(x=>x.textContent.toLowerCase().includes('sender identity status')),mobile:!document.querySelector('[data-mobile-filter="mail"]'),label:!document.querySelector('[data-label="legacy-mail-label"]'),password:[...document.querySelectorAll('h4')].some(x=>x.textContent.includes('Password & sign-in')),users:[...document.querySelectorAll('h4')].some(x=>x.textContent.includes('Mail users & personal mailboxes'))};document.body.dataset.testStatus=Object.values(checks).every(Boolean)?'PASS':'FAIL';document.body.dataset.testDetails=JSON.stringify(checks)})();</script>
          </body></html>`);
          NODE
          python3 -m http.server 8126 --directory /tmp/ffmailtest >/tmp/ffmailtest.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT; sleep .4
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8126/index.html >/tmp/ffmaildom.txt
          grep -o 'data-test-details="[^"]*"' /tmp/ffmaildom.txt | tail -1 || true
          grep -q 'data-test-status="PASS"' /tmp/ffmaildom.txt

      - name: Build
        run: |
          rm -rf _site && mkdir _site
          cp index.html manifest.webmanifest sw.js robots.txt ship.json _site/
          cp -R assets _site/assets

      - name: Deploy
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./_site
          domain: mail-frankiflow.shipstatic.com
          labels: development,frankiflow-mail,develop

      - name: Verify live assets
        run: |
          set -euo pipefail
          BASE=https://mail-frankiflow.shipstatic.com
          for i in 1 2 3 4 5 6; do curl -fsSL "$BASE/?verify=$GITHUB_SHA" -o /tmp/home && break || sleep 3; done
          grep -q 'account-security.js' /tmp/home
          curl -fsSL "$BASE/assets/account-security.js?verify=$GITHUB_SHA" -o /tmp/sec.js
          curl -fsSL "$BASE/sw.js?verify=$GITHUB_SHA" -o /tmp/sw.js
          grep -q 'hideLegacyMailLabel' /tmp/sec.js
          grep -q 'frankiflow-mail-dev-v17' /tmp/sw.js
